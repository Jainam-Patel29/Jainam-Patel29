<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" role="img" aria-label="Safety stock and reorder point example: stock falls to the reorder point of 115, an order is placed, and stock arrives after 5 days of lead time. In the second cycle demand runs above average and the safety stock of 15 absorbs it." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:Segoe UI,Helvetica,Arial,sans-serif}
.t{font-size:12px;font-weight:700;fill:#2f6f9f;letter-spacing:3px}
.ax{font-size:10px;fill:#6b7280;text-anchor:middle}
.gr{stroke:#e3e9f0}
.s{fill:none;stroke:#0b1f3a;stroke-width:2.5;stroke-linejoin:round;stroke-dasharray:1;animation:dS 16s linear infinite}
.rp{stroke:#1aa6a6;stroke-width:1.5;stroke-dasharray:6 5;animation:sh 1.4s linear infinite}
.m{fill:#1aa6a6;opacity:0;animation-duration:16s;animation-iteration-count:infinite}
.rc{fill:#0b1f3a;opacity:0;animation-duration:16s;animation-iteration-count:infinite}
.ml{font-size:9px;letter-spacing:1px;fill:#0b1f3a;text-anchor:middle;opacity:0;animation-duration:16s;animation-iteration-count:infinite}
.k{font-size:10px;letter-spacing:2px;fill:#4b5563}
.n{font-size:30px;font-weight:700;fill:#0b1f3a}
.f{font-size:11px;fill:#6b7280}
.i{font-size:11px;fill:#0b1f3a}
.b1{animation:r1 16s infinite}.b2{animation:r2 16s infinite}.b3{animation:r3 16s infinite}
@keyframes sh{to{stroke-dashoffset:-22}}
@keyframes dS{0%,4%{stroke-dashoffset:1;opacity:1}64%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes o0{0%,10.6%{opacity:0}11.6%,90%{opacity:1}100%{opacity:0}}@keyframes o1{0%,36.6%{opacity:0}37.6%,90%{opacity:1}100%{opacity:0}}@keyframes v0{0%,29.0%{opacity:0}30.0%,90%{opacity:1}100%{opacity:0}}@keyframes v1{0%,55.4%{opacity:0}56.4%,90%{opacity:1}100%{opacity:0}}@keyframes r1{0%,66.0%{opacity:0}70.0%,90%{opacity:1}100%{opacity:0}}@keyframes r2{0%,70.0%{opacity:0}74.0%,90%{opacity:1}100%{opacity:0}}@keyframes r3{0%,74.0%{opacity:0}78.0%,90%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.m,.rc,.ml,.b1,.b2,.b3{opacity:1!important}.s{stroke-dashoffset:0}}
</style>
<rect width="1000" height="460" fill="#f7f8fa"/>
<text class="t" x="40" y="36">2 · SAFETY STOCK &amp; REORDER POINT</text>
<rect x="198.0" y="70" width="108.0" height="270" fill="#2f6f9f" opacity=".07"/><text class="ax" x="252.0" y="84" style="font-size:9px;letter-spacing:1.5px">LEAD TIME · 5 DAYS</text><rect x="414.0" y="70" width="108.0" height="270" fill="#2f6f9f" opacity=".07"/><text class="ax" x="468.0" y="84" style="font-size:9px;letter-spacing:1.5px">LEAD TIME · 5 DAYS</text><line class="gr" x1="70" y1="340.0" x2="640" y2="340.0"/><text class="ax" x="58" y="343.0" style="text-anchor:end">0</text><line class="gr" x1="70" y1="286.0" x2="640" y2="286.0"/><text class="ax" x="58" y="289.0" style="text-anchor:end">50</text><line class="gr" x1="70" y1="232.0" x2="640" y2="232.0"/><text class="ax" x="58" y="235.0" style="text-anchor:end">100</text><line class="gr" x1="70" y1="178.0" x2="640" y2="178.0"/><text class="ax" x="58" y="181.0" style="text-anchor:end">150</text><line class="gr" x1="70" y1="124.0" x2="640" y2="124.0"/><text class="ax" x="58" y="127.0" style="text-anchor:end">200</text><line class="gr" x1="70" y1="70.0" x2="640" y2="70.0"/><text class="ax" x="58" y="73.0" style="text-anchor:end">250</text><text class="ax" x="90.0" y="362">0</text><text class="ax" x="198.0" y="362">5</text><text class="ax" x="306.0" y="362">10</text><text class="ax" x="414.0" y="362">15</text><text class="ax" x="522.0" y="362">20</text><text class="ax" x="630.0" y="362">25</text>
<text class="ax" x="355" y="380" style="letter-spacing:2px">DAYS</text>
<rect x="70" y="323.8" width="570" height="16.19999999999999" fill="#c2410c" opacity=".14"/>
<line class="rp" x1="70" y1="215.8" x2="640" y2="215.8"/>
<text class="k" x="96" y="209.8" style="fill:#1aa6a6">REORDER POINT 115</text>
<text class="k" x="96" y="318.8" style="fill:#c2410c">SAFETY STOCK 15</text>
<path class="s" pathLength="1" d="M90.0 107.8 L198.0 215.8 L306.0 323.8 L306.0 107.8 L414.0 215.8 L522.0 334.6 L522.0 118.6 L630.0 226.6"/>
<circle r="5" fill="#0b1f3a"><animateMotion dur="16s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;.04;.64;1" path="M90.0 107.8 L198.0 215.8 L306.0 323.8 L306.0 107.8 L414.0 215.8 L522.0 334.6 L522.0 118.6 L630.0 226.6"/></circle>
<circle class="m" style="animation-name:o0" cx="198.0" cy="215.8" r="6"/><text class="ml" style="animation-name:o0" x="198.0" y="203.8">ORDER</text><circle class="m" style="animation-name:o1" cx="414.0" cy="215.8" r="6"/><text class="ml" style="animation-name:o1" x="414.0" y="203.8">ORDER</text><path class="rc" style="animation-name:v0" d="M306.0 105.8l-6 -10h12z"/><text class="ml" style="animation-name:v0" x="310.0" y="343.8">RECEIPT</text><path class="rc" style="animation-name:v1" d="M522.0 116.6l-6 -10h12z"/><text class="ml" style="animation-name:v1" x="526.0" y="354.6">RECEIPT</text>
<text class="k" x="700" y="66" style="fill:#2f6f9f">INPUTS (ILLUSTRATIVE)</text>
<text class="i" x="700" y="90">Average daily demand · 20 units</text><text class="i" x="700" y="108">Daily demand std. dev. · 4 units</text><text class="i" x="700" y="126">Lead time · 5 days</text><text class="i" x="700" y="144">Service level · 95% (Z = 1.65)</text>
<g class="b1"><text class="k" x="700" y="188">SAFETY STOCK</text><text class="n" x="700" y="222">≈ 15</text><text class="f" x="700" y="240">Z × σ × √LT = 1.65 × 4 × √5</text></g>
<g class="b2"><text class="k" x="700" y="272">REORDER POINT</text><text class="n" x="700" y="306">115</text><text class="f" x="700" y="324">20 × 5 + 15 (demand in lead time + buffer)</text></g>
<g class="b3"><text class="k" x="700" y="356" style="fill:#c2410c">CYCLE 2: DEMAND RUNS ABOVE AVERAGE</text><text class="f" x="700" y="374">Stock dips to 5, inside the buffer.</text><text class="f" x="700" y="390">No stockout.</text></g>
<line x1="70" y1="416" x2="96" y2="416" stroke="#0b1f3a" stroke-width="2.5"/><text class="k" x="104" y="420">STOCK ON HAND (UNITS)</text>
<line x1="290" y1="416" x2="316" y2="416" stroke="#1aa6a6" stroke-width="1.5" stroke-dasharray="6 5"/><text class="k" x="324" y="420">REORDER POINT</text>
<rect x="450" y="410" width="26" height="10" fill="#c2410c" opacity=".3"/><text class="k" x="484" y="420">SAFETY STOCK BUFFER</text>
<text class="k" x="40" y="446" style="font-size:9px;fill:#6b7280">ILLUSTRATIVE EXAMPLE DATA · NOT COMPANY DATA</text>
</svg>