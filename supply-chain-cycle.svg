<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="100%" role="img" aria-label="Supply chain cycle: demand, forecast, plan, source, inventory, distribute, analyze, decide, improve" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:9.5px;font-weight:700;fill:#0b1f3a;text-anchor:middle;letter-spacing:.5px}
.ring{fill:none;stroke:#9db4c8;stroke-width:1.5;stroke-dasharray:6 6;animation:d 1.4s linear infinite}
.n{fill:#fff;stroke:#0b1f3a;stroke-width:1.5;animation:p 3.6s ease-in-out infinite}
@keyframes d{to{stroke-dashoffset:-24}}
@keyframes p{50%{stroke:#1aa6a6;stroke-width:3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="600" height="440" fill="#f7f8fa"/>
<circle class="ring" cx="300" cy="220" r="160"/>
<circle class="n" cx="300.0" cy="60.0" r="36" style="animation-delay:0.0s"/><text x="300.0" y="63.0">DEMAND</text>
<circle class="n" cx="402.8" cy="97.4" r="36" style="animation-delay:0.4s"/><text x="402.8" y="100.4">FORECAST</text>
<circle class="n" cx="457.6" cy="192.2" r="36" style="animation-delay:0.8s"/><text x="457.6" y="195.2">PLAN</text>
<circle class="n" cx="438.6" cy="300.0" r="36" style="animation-delay:1.2s"/><text x="438.6" y="303.0">SOURCE</text>
<circle class="n" cx="354.7" cy="370.4" r="36" style="animation-delay:1.6s"/><text x="354.7" y="373.4">INVENTORY</text>
<circle class="n" cx="245.3" cy="370.4" r="36" style="animation-delay:2.0s"/><text x="245.3" y="373.4">DISTRIBUTE</text>
<circle class="n" cx="161.4" cy="300.0" r="36" style="animation-delay:2.4s"/><text x="161.4" y="303.0">ANALYZE</text>
<circle class="n" cx="142.4" cy="192.2" r="36" style="animation-delay:2.8s"/><text x="142.4" y="195.2">DECIDE</text>
<circle class="n" cx="197.2" cy="97.4" r="36" style="animation-delay:3.2s"/><text x="197.2" y="100.4">IMPROVE</text>
<text x="300" y="214" style="font-size:13px;letter-spacing:3px">SUPPLY CHAIN</text>
<text x="300" y="234" style="font-size:13px;letter-spacing:3px;fill:#2f6f9f">CYCLE</text>
<g fill="#1aa6a6"><circle r="6"><animateMotion dur="12s" repeatCount="indefinite" path="M300 60A160 160 0 1 1 300 380A160 160 0 1 1 300 60"/></circle>
<circle r="6" fill="#0b1f3a"><animateMotion dur="12s" begin="-6s" repeatCount="indefinite" path="M300 60A160 160 0 1 1 300 380A160 160 0 1 1 300 60"/></circle></g>
</svg>