<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" role="img" aria-label="Forecast accuracy example: actual demand versus forecast over 8 periods, WAPE 6.9 percent, accuracy 93.1 percent, bias plus 4.6 percent over-forecast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:Segoe UI,Helvetica,Arial,sans-serif}
.t{font-size:12px;font-weight:700;fill:#2f6f9f;letter-spacing:3px}
.ax{font-size:10px;fill:#6b7280;text-anchor:middle}
.gr{stroke:#e3e9f0}
.la{fill:none;stroke:#0b1f3a;stroke-width:2.5;stroke-dasharray:1;animation:dA 13s ease-in-out infinite}
.lf{fill:none;stroke:#1aa6a6;stroke-width:2.5;stroke-dasharray:1;animation:dF 13s ease-in-out infinite}
.g{stroke:#c2410c;stroke-width:3;stroke-dasharray:1;animation:dG 13s ease-in-out infinite}
.da{fill:#0b1f3a;animation:fA 13s infinite}.df{fill:#1aa6a6;animation:fF 13s infinite}
.k{font-size:10px;letter-spacing:2px;fill:#4b5563}
.n{font-size:32px;font-weight:700;fill:#0b1f3a}
.f{font-size:11px;fill:#6b7280}
.b1{animation:r1 13s infinite}.b2{animation:r2 13s infinite}.b3{animation:r3 13s infinite}
@keyframes dA{0%,3%{stroke-dashoffset:1;opacity:1}18%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes fA{0%,3%{opacity:0}18%,90%{opacity:1}100%{opacity:0}}@keyframes dF{0%,20%{stroke-dashoffset:1;opacity:1}36%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes fF{0%,20%{opacity:0}36%,90%{opacity:1}100%{opacity:0}}@keyframes dG{0%,38%{stroke-dashoffset:1;opacity:1}52%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}@keyframes r1{0%,54%{opacity:0}58%,90%{opacity:1}100%{opacity:0}}@keyframes r2{0%,58%{opacity:0}62%,90%{opacity:1}100%{opacity:0}}@keyframes r3{0%,62%{opacity:0}66%,90%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.la,.lf,.g{stroke-dashoffset:0}}
</style>
<rect width="1000" height="460" fill="#f7f8fa"/>
<text class="t" x="40" y="36">1 · FORECAST ACCURACY, WAPE &amp; BIAS</text>
<line class="gr" x1="70" y1="340" x2="640" y2="340"/><text class="ax" x="58" y="343" style="text-anchor:end">80</text><line class="gr" x1="70" y1="260" x2="640" y2="260"/><text class="ax" x="58" y="263" style="text-anchor:end">100</text><line class="gr" x1="70" y1="180" x2="640" y2="180"/><text class="ax" x="58" y="183" style="text-anchor:end">120</text><line class="gr" x1="70" y1="100" x2="640" y2="100"/><text class="ax" x="58" y="103" style="text-anchor:end">140</text><text class="ax" x="90" y="362">P1</text><text class="ax" x="165" y="362">P2</text><text class="ax" x="240" y="362">P3</text><text class="ax" x="315" y="362">P4</text><text class="ax" x="390" y="362">P5</text><text class="ax" x="465" y="362">P6</text><text class="ax" x="540" y="362">P7</text><text class="ax" x="615" y="362">P8</text>
<path class="la" pathLength="1" d="M90 260 L165 180 L240 300 L315 220 L390 140 L465 280 L540 240 L615 160"/><circle class="da" cx="90" cy="260" r="4"/><circle class="da" cx="165" cy="180" r="4"/><circle class="da" cx="240" cy="300" r="4"/><circle class="da" cx="315" cy="220" r="4"/><circle class="da" cx="390" cy="140" r="4"/><circle class="da" cx="465" cy="280" r="4"/><circle class="da" cx="540" cy="240" r="4"/><circle class="da" cx="615" cy="160" r="4"/>
<path class="lf" pathLength="1" d="M90 220 L165 160 L240 260 L315 240 L390 100 L465 260 L540 200 L615 180"/><circle class="df" cx="90" cy="220" r="4"/><circle class="df" cx="165" cy="160" r="4"/><circle class="df" cx="240" cy="260" r="4"/><circle class="df" cx="315" cy="240" r="4"/><circle class="df" cx="390" cy="100" r="4"/><circle class="df" cx="465" cy="260" r="4"/><circle class="df" cx="540" cy="200" r="4"/><circle class="df" cx="615" cy="180" r="4"/>
<line class="g" pathLength="1" x1="90" y1="260" x2="90" y2="220"/><line class="g" pathLength="1" x1="165" y1="180" x2="165" y2="160"/><line class="g" pathLength="1" x1="240" y1="300" x2="240" y2="260"/><line class="g" pathLength="1" x1="315" y1="220" x2="315" y2="240"/><line class="g" pathLength="1" x1="390" y1="140" x2="390" y2="100"/><line class="g" pathLength="1" x1="465" y1="280" x2="465" y2="260"/><line class="g" pathLength="1" x1="540" y1="240" x2="540" y2="200"/><line class="g" pathLength="1" x1="615" y1="160" x2="615" y2="180"/>
<g class="b1"><text class="k" x="700" y="90">WAPE</text><text class="n" x="700" y="126">6.9%</text><text class="f" x="700" y="146">Σ|A−F| ÷ ΣA = 60 ÷ 875</text></g>
<g class="b2"><text class="k" x="700" y="190">FORECAST ACCURACY</text><text class="n" x="700" y="226">93.1%</text><text class="f" x="700" y="246">1 − WAPE</text></g>
<g class="b3"><text class="k" x="700" y="290">BIAS</text><text class="n" x="700" y="326" style="fill:#c2410c">+4.6%</text><text class="f" x="700" y="346">Σ(F−A) ÷ ΣA = 40 ÷ 875 · OVER-FORECAST</text></g>
<g><line x1="70" y1="404" x2="96" y2="404" stroke="#0b1f3a" stroke-width="2.5"/><text class="k" x="104" y="408">ACTUAL (A)</text>
<line x1="220" y1="404" x2="246" y2="404" stroke="#1aa6a6" stroke-width="2.5"/><text class="k" x="254" y="408">FORECAST (F)</text>
<line x1="390" y1="404" x2="416" y2="404" stroke="#c2410c" stroke-width="3"/><text class="k" x="424" y="408">ERROR |A−F|</text></g>
<text class="k" x="40" y="444" style="font-size:9px;fill:#6b7280">ILLUSTRATIVE EXAMPLE DATA · NOT COMPANY DATA</text>
</svg>