<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" role="img" aria-label="S and OP monthly cycle: demand review, supply review, reconciliation, executive decision. Demand and supply bars start with gaps, the gaps are resolved, and one consensus plan is approved." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:Segoe UI,Helvetica,Arial,sans-serif}
.t{font-size:12px;font-weight:700;fill:#2f6f9f;letter-spacing:3px}
.ax{font-size:10px;fill:#6b7280;text-anchor:middle}
.cn{font-size:22px;font-weight:700;fill:#2f6f9f}.ct{font-size:13px;font-weight:700;fill:#0b1f3a;letter-spacing:.5px}
.f{font-size:11px;fill:#4b5563}.k{font-size:10px;letter-spacing:2px;fill:#4b5563}
.gt{font-size:10px;font-weight:700;fill:#c2410c;letter-spacing:1px}
.hl,.tx,.gp,.stamp,.frame{animation-duration:20s;animation-iteration-count:infinite}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation-duration:20s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.gp{animation-name:gp}.stamp{animation-name:st}.frame{animation-name:fr}
.rm{display:none}
@keyframes dem{0%,5%{transform:scaleY(0);opacity:1}18%,90%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}@keyframes sup{0%,25%{transform:scaleY(0);opacity:1}38%,90%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}@keyframes sup2{0%,25%{transform:scaleY(0);opacity:1}38%,49%{transform:scaleY(1);opacity:1}58%,90%{transform:scaleY(1.2);opacity:1}100%{transform:scaleY(1.2);opacity:0}}@keyframes sup3{0%,25%{transform:scaleY(0);opacity:1}38%,49%{transform:scaleY(1);opacity:1}58%,90%{transform:scaleY(.9333);opacity:1}100%{transform:scaleY(.9333);opacity:0}}@keyframes g1{0%,4%{opacity:0}5%,25%{opacity:1}26%,100%{opacity:0}}@keyframes g2{0%,24%{opacity:0}25%,45%{opacity:1}46%,100%{opacity:0}}@keyframes g3{0%,44%{opacity:0}45%,65%{opacity:1}66%,100%{opacity:0}}@keyframes g4{0%,64%{opacity:0}65%,85%{opacity:1}86%,100%{opacity:0}}@keyframes gp{0%,40%{opacity:0}41%,57%{opacity:1}58%,100%{opacity:0}}@keyframes st{0%,68%{opacity:0}72%,90%{opacity:1}100%{opacity:0}}@keyframes fr{0%,68%{opacity:0}72%,90%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.b1{transform:scaleY(1.2)}.b2{transform:scaleY(.9333)}.gp,.hl,.tx{display:none}.rm{display:inline}}
</style>
<rect width="1000" height="460" fill="#f7f8fa"/>
<text class="t" x="40" y="36">5 · S&amp;OP: THE MONTHLY PLANNING CYCLE</text>
<rect x="40" y="66" width="210" height="62" fill="#fff" stroke="#d5dde6"/><text class="cn" x="56" y="94">1</text><text class="ct" x="80" y="92">DEMAND REVIEW</text><text class="f" x="80" y="112">Update the forecast</text><rect class="hl" style="animation-name:g1" x="40" y="66" width="210" height="62" fill="none" stroke="#1aa6a6" stroke-width="3"/><rect x="265" y="66" width="210" height="62" fill="#fff" stroke="#d5dde6"/><text class="cn" x="281" y="94">2</text><text class="ct" x="305" y="92">SUPPLY REVIEW</text><text class="f" x="305" y="112">Check capacity &amp; materials</text><rect class="hl" style="animation-name:g2" x="265" y="66" width="210" height="62" fill="none" stroke="#1aa6a6" stroke-width="3"/><rect x="490" y="66" width="210" height="62" fill="#fff" stroke="#d5dde6"/><text class="cn" x="506" y="94">3</text><text class="ct" x="530" y="92">RECONCILIATION</text><text class="f" x="530" y="112">Resolve the gaps</text><rect class="hl" style="animation-name:g3" x="490" y="66" width="210" height="62" fill="none" stroke="#1aa6a6" stroke-width="3"/><rect x="715" y="66" width="210" height="62" fill="#fff" stroke="#d5dde6"/><text class="cn" x="731" y="94">4</text><text class="ct" x="755" y="92">EXECUTIVE DECISION</text><text class="f" x="755" y="112">Approve one plan</text><rect class="hl" style="animation-name:g4" x="715" y="66" width="210" height="62" fill="none" stroke="#1aa6a6" stroke-width="3"/>
<line x1="90" y1="380" x2="640" y2="380" stroke="#9db4c8"/>
<rect class="frame" x="96" y="168" width="548" height="224" fill="none" stroke="#1aa6a6" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect class="bar" style="animation-name:dem" x="118" y="250.0" width="28" height="130.0" fill="#0b1f3a"/><rect class="bar b0" style="animation-name:sup" x="154" y="250.0" width="28" height="130.0" fill="#1aa6a6"/><text class="ax" x="150" y="398">M1</text><rect class="bar" style="animation-name:dem" x="253" y="224.0" width="28" height="156.0" fill="#0b1f3a"/><rect class="bar b1" style="animation-name:sup2" x="289" y="250.0" width="28" height="130.0" fill="#1aa6a6"/><text class="ax" x="285" y="398">M2</text><rect class="bar" style="animation-name:dem" x="388" y="198.0" width="28" height="182.0" fill="#0b1f3a"/><rect class="bar b2" style="animation-name:sup3" x="424" y="185.0" width="28" height="195.0" fill="#1aa6a6"/><text class="ax" x="420" y="398">M3</text><rect class="bar" style="animation-name:dem" x="523" y="237.0" width="28" height="143.0" fill="#0b1f3a"/><rect class="bar b3" style="animation-name:sup" x="559" y="237.0" width="28" height="143.0" fill="#1aa6a6"/><text class="ax" x="555" y="398">M4</text><g class="gp"><rect x="289" y="224.0" width="28" height="26.0" fill="#c2410c" opacity=".85"/><text class="gt" x="323" y="237.0">SHORT 20</text><rect x="424" y="185.0" width="28" height="13.0" fill="#c2410c" opacity=".85"/><text class="gt" x="458" y="191.5">EXCESS 10</text></g>
<g class="tx" style="animation-name:g1"><text class="ct" x="700" y="200">DEMAND REVIEW</text><text class="f" x="700" y="222">Update the forecast with sales input</text><text class="f" x="700" y="240">and market information.</text></g><g class="tx" style="animation-name:g2"><text class="ct" x="700" y="200">SUPPLY REVIEW</text><text class="f" x="700" y="222">Check whether capacity, materials and</text><text class="f" x="700" y="240">logistics can meet that demand.</text></g><g class="tx" style="animation-name:g3"><text class="ct" x="700" y="200">RECONCILIATION</text><text class="f" x="700" y="222">Resolve the gaps between demand and</text><text class="f" x="700" y="240">supply across sales, finance,</text><text class="f" x="700" y="258">procurement and operations.</text></g><g class="tx" style="animation-name:g4"><text class="ct" x="700" y="200">EXECUTIVE DECISION</text><text class="f" x="700" y="222">Leadership approves one</text><text class="f" x="700" y="240">consensus plan.</text></g>
<text class="f rm" x="700" y="200">Demand review, supply review, reconciliation, executive decision: one agreed plan.</text>
<g class="stamp"><rect x="700" y="310" width="240" height="56" fill="#fff" stroke="#1aa6a6" stroke-width="2"/><path d="M718 338 l8 8 l14 -16" fill="none" stroke="#1aa6a6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="ct" x="752" y="343" style="letter-spacing:1.5px">ONE AGREED PLAN</text></g>
<rect x="90" y="418" width="14" height="10" fill="#0b1f3a"/><text class="k" x="110" y="427">DEMAND</text><rect x="200" y="418" width="14" height="10" fill="#1aa6a6"/><text class="k" x="220" y="427">SUPPLY</text><rect x="310" y="418" width="14" height="10" fill="#c2410c"/><text class="k" x="330" y="427">GAP</text>
<text class="k" x="40" y="452" style="font-size:9px;fill:#6b7280">ILLUSTRATIVE EXAMPLE · NOT COMPANY DATA</text>
</svg>