<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="100%" role="img" aria-label="Inventory turns example: two companies ship one unit per second, Company A holds 100,000 of average inventory and turns 12 times a year with about 30 days on hand, Company B holds 300,000 and turns 4 times with about 91 days on hand" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:Segoe UI,Helvetica,Arial,sans-serif}
.t{font-size:12px;font-weight:700;fill:#2f6f9f;letter-spacing:3px}
.k{font-size:10px;letter-spacing:2px;fill:#4b5563}
.n{font-size:34px;font-weight:700}
.f{font-size:12px;fill:#0b1f3a}
.bt{stroke:#9db4c8;stroke-width:2}
.fa{animation:sl 3s linear infinite}.fb{animation:sl 9s linear infinite}
.pl{transform-box:fill-box;transform-origin:center;animation:pu 1s ease-out infinite}
@keyframes sl{from{transform:translateX(0)}to{transform:translateX(470px)}}
@keyframes pu{from{transform:scale(.4);opacity:1}to{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.bx{transform:translateX(var(--x))}}
</style>
<rect width="1000" height="460" fill="#f7f8fa"/>
<text class="t" x="40" y="36">3 · INVENTORY TURNS &amp; DAYS ON HAND</text>
<text class="k" x="90" y="62" style="font-size:9.5px">1 BOX = A SLICE OF STOCK · BOTH COMPANIES SHIP ONE BOX PER SECOND (SAME COGS)</text>
<text class="k" x="90" y="80" style="fill:#1aa6a6">COMPANY A · AVERAGE INVENTORY 100,000</text><line class="bt" x1="90" y1="130" x2="590" y2="130"/><rect class="bx fa" x="90" y="102" width="28" height="26" rx="3" fill="#1aa6a6" style="animation-delay:-0s;--x:0px"/><rect class="bx fa" x="90" y="102" width="28" height="26" rx="3" fill="#1aa6a6" style="animation-delay:-1s;--x:157px"/><rect class="bx fa" x="90" y="102" width="28" height="26" rx="3" fill="#1aa6a6" style="animation-delay:-2s;--x:313px"/><circle class="pl" cx="604" cy="116" r="10" fill="none" stroke="#1aa6a6" stroke-width="2"/><circle cx="604" cy="116" r="3" fill="#1aa6a6"/><text class="k" x="640" y="90">INVENTORY TURNS</text><text class="n" x="640" y="122" style="fill:#1aa6a6">12</text><text class="k" x="720" y="90">DAYS ON HAND</text><text class="n" x="720" y="122" style="fill:#1aa6a6">≈ 30</text><text class="k" x="90" y="200" style="fill:#2f6f9f">COMPANY B · AVERAGE INVENTORY 300,000</text><line class="bt" x1="90" y1="250" x2="590" y2="250"/><rect class="bx fb" x="90" y="222" width="28" height="26" rx="3" fill="#2f6f9f" style="animation-delay:-0s;--x:0px"/><rect class="bx fb" x="90" y="222" width="28" height="26" rx="3" fill="#2f6f9f" style="animation-delay:-1s;--x:52px"/><rect class="bx fb" x="90" y="222" width="28" height="26" rx="3" fill="#2f6f9f" style="animation-delay:-2s;--x:104px"/><rect class="bx fb" x="90" y="222" width="28" height="26" rx="3" fill="#2f6f9f" style="animation-delay:-3s;--x:157px"/><rect class="bx fb" x="90" y="222" width="28" height="26" rx="3" fill="#2f6f9f" style="animation-delay:-4s;--x:209px"/><rect class="bx fb" x="90" y="222" width="28" height="26" rx="3" fill="#2f6f9f" style="animation-delay:-5s;--x:261px"/><rect class="bx fb" x="90" y="222" width="28" height="26" rx="3" fill="#2f6f9f" style="animation-delay:-6s;--x:313px"/><rect class="bx fb" x="90" y="222" width="28" height="26" rx="3" fill="#2f6f9f" style="animation-delay:-7s;--x:366px"/><rect class="bx fb" x="90" y="222" width="28" height="26" rx="3" fill="#2f6f9f" style="animation-delay:-8s;--x:418px"/><circle class="pl" cx="604" cy="236" r="10" fill="none" stroke="#2f6f9f" stroke-width="2"/><circle cx="604" cy="236" r="3" fill="#2f6f9f"/><text class="k" x="640" y="210">INVENTORY TURNS</text><text class="n" x="640" y="242" style="fill:#2f6f9f">4</text><text class="k" x="720" y="210">DAYS ON HAND</text><text class="n" x="720" y="242" style="fill:#2f6f9f">≈ 91</text>
<text class="k" x="90" y="312" style="fill:#0b1f3a">SAME SALES OUTPUT, THREE TIMES THE STOCK ON THE BELT</text>
<line x1="90" y1="330" x2="910" y2="330" stroke="#d5dde6"/>
<text class="f" x="90" y="360">Inventory Turns = COGS ÷ Average Inventory</text><text class="f" x="90" y="382" style="fill:#6b7280">A: 1,200,000 ÷ 100,000 = 12    ·    B: 1,200,000 ÷ 300,000 = 4</text>
<text class="f" x="90" y="410">Days on Hand = 365 ÷ Turns</text><text class="f" x="90" y="432" style="fill:#6b7280">A: 365 ÷ 12 ≈ 30 days    ·    B: 365 ÷ 4 ≈ 91 days</text>
<text class="k" x="640" y="446" style="font-size:9px;fill:#6b7280">ILLUSTRATIVE EXAMPLE · NOT COMPANY DATA</text>
</svg>